[package]
name = "junko-discord-bot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serenity = { version = "0.12", features = ["client", "standard_framework", "voice", "cache"] }
songbird = { version = "0.4", features = ["driver", "builtin-queue", "serenity"] }
symphonia = { version = "0.5.2", default-features = false, features = ["mkv", "mp3", "ogg", "wav", "aac", "isomp4", "flac", "pcm"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4.0"
scraper = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
